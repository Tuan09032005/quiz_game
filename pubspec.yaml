name: quiz_game
description: "Quiz Game - Flutter + Supabase"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^5.2.0

  # UI
  cupertino_icons: ^1.0.8

  # Backend (Supabase)
  supabase_flutter: ^2.5.6

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/backgroundmusic.mp3
    - assets/sounds/button.mp3
